<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Бей посуду</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Neucha&family=Unbounded:wght@600;800&family=Manrope:wght@500;700&display=swap">
<style>
/* Layout: full-bleed scene canvas (3 locations); title + location switch float top-left, the writing tray docks at the bottom */
:root{
  --grout:#122426; --tray:#0d1b1c; --ink:#f3ead8; --muted:#a6bfba; --accent:#ff9a6b;
  --field:#f7f1e4; --field-ink:#24324a; --paper:#fbf4e2; --paper-ink:#3a2b22;
  --head-ink:#f3ead8; --head-muted:#a6bfba; --head-ghost:rgba(13,27,28,.5); --head-line:rgba(243,234,216,.25); --toast-shadow:rgba(0,0,0,.6);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-hand:"Neucha","Comic Sans MS",cursive;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--grout);color:var(--ink);font-family:var(--f-body);overflow:hidden}
.app{position:relative;height:100%;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.dragging{cursor:grabbing}
.top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px;pointer-events:none;color:var(--head-ink)}
.top > div{min-width:0}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,5.2vw,34px);line-height:1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:8px 0 0;color:var(--head-muted);font-size:14px;line-height:1.4;max-width:30ch}
.locs{display:flex;gap:4px;margin-top:12px;pointer-events:auto;flex-wrap:wrap}
.loc{font:600 12px var(--f-body);color:var(--head-muted);background:var(--head-ghost);border:1px solid var(--head-line);padding:6px 11px;border-radius:999px;cursor:pointer}
.loc[aria-pressed="true"]{color:var(--tray);background:var(--head-ink);border-color:var(--head-ink)}
.stats{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:auto;flex-shrink:0}
.count{font-family:var(--f-display);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--head-muted);white-space:nowrap;text-align:right}
.count b{display:block;color:var(--accent);font-size:26px;letter-spacing:0;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ghost{background:var(--head-ghost);border:1px solid var(--head-line);color:var(--head-muted);font:600 12px var(--f-body);padding:6px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
.ghost:hover{color:var(--head-ink)}
.tray{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--tray) 55%,rgba(13,27,28,0))}
.dishes{display:flex;gap:6px;overflow-x:auto;max-width:100%;justify-content:safe center;scrollbar-width:none;padding:2px}
.dishes::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;font:600 13px var(--f-body);color:var(--muted);background:rgba(243,234,216,.06);border:1px solid rgba(243,234,216,.16);padding:7px 13px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{color:var(--tray);background:var(--ink);border-color:var(--ink)}
form{display:flex;gap:8px;width:100%;max-width:520px}
#thought{flex:1;min-width:0;font:22px var(--f-hand);color:var(--field-ink);background:var(--field);border:0;border-radius:14px;padding:12px 16px;outline:none}
#thought::placeholder{color:#8a8f98}
#thought:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.throw{font:700 15px var(--f-body);background:var(--accent);color:#2a1408;border:0;border-radius:14px;padding:0 20px;cursor:pointer;white-space:nowrap}
.throw:active{transform:translateY(1px)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hint{margin:0;font-size:12px;color:var(--muted);text-align:center;max-width:46ch}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-40%);font:clamp(28px,7vw,44px) var(--f-hand);color:var(--head-ink);opacity:0;pointer-events:none;white-space:nowrap;text-shadow:0 3px 18px var(--toast-shadow);transition:opacity .35s,transform .7s}
.toast.show{opacity:1;transform:translate(-50%,-70%)}
.combo{position:absolute;right:16px;top:44%;font:800 clamp(18px,4vw,26px) var(--f-display);color:var(--accent);opacity:0;pointer-events:none;transition:opacity .25s,transform .4s;transform:scale(.8) rotate(-6deg);text-shadow:0 2px 10px var(--toast-shadow)}
.combo.show{opacity:1;transform:scale(1) rotate(-6deg)}
.note{position:absolute;left:50%;top:46%;width:min(320px,calc(100% - 32px));transform:translate(-50%,-50%) rotate(-2deg);background:var(--paper);color:var(--paper-ink);border-radius:4px;padding:22px 22px 18px;box-shadow:0 20px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:14px;animation:drop .5s cubic-bezier(.2,1.4,.4,1)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:84px;height:22px;transform:translateX(-50%) rotate(3deg);background:rgba(255,154,107,.55)}
.note small{font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:#9a7c66}
.note p{margin:0;font:26px/1.2 var(--f-hand)}
.note button{align-self:flex-start;font:700 14px var(--f-body);background:var(--paper-ink);color:var(--paper);border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
@keyframes drop{from{opacity:0;transform:translate(-50%,-90%) rotate(-8deg)}}
@media (prefers-reduced-motion:reduce){.toast,.combo{transition:opacity .2s}.note{animation:none}}
</style>

<div class="app" id="app" data-loc="kitchen">
  <canvas id="c" aria-label="Смахни посуду вверх, чтобы разбить её о стену"></canvas>
  <div class="top">
    <div>
      <h1>Бей посуду</h1>
      <p class="sub">Напиши то, что гложет, и разбей это о стену.</p>
      <div class="locs" role="group" aria-label="Где бьём">
        <button class="loc" type="button" data-loc="kitchen" aria-pressed="true">Кухня</button>
        <button class="loc" type="button" data-loc="showroom" aria-pressed="false">Maserati</button>
        <button class="loc" type="button" data-loc="roof" aria-pressed="false">Крыша</button>
      </div>
    </div>
    <div class="stats">
      <div class="count">разбито<b id="count">0</b></div>
      <div class="tools">
        <button class="ghost" id="sweep" type="button">Подмести</button>
        <button class="ghost" id="mute" type="button">Звук: вкл</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" aria-live="polite"></div>
  <div class="combo" id="combo" aria-hidden="true"></div>
  <div class="note" id="note" role="dialog" aria-labelledby="note-text" hidden>
    <small>Записка для тебя</small>
    <p id="note-text"></p>
    <button type="button" id="note-close">Обнять в ответ</button>
  </div>
  <div class="tray">
    <div class="dishes" role="group" aria-label="Что бросаем">
      <button class="chip" type="button" data-dish="plate" aria-pressed="true">Тарелка</button>
      <button class="chip" type="button" data-dish="bowl" aria-pressed="false">Миска</button>
      <button class="chip" type="button" data-dish="saucer" aria-pressed="false">Блюдце</button>
      <button class="chip" type="button" data-dish="mug" aria-pressed="false">Кружка</button>
      <button class="chip" type="button" data-dish="glass" aria-pressed="false">Стакан</button>
      <button class="chip" type="button" data-dish="wine" aria-pressed="false">Бокал</button>
      <button class="chip" type="button" data-dish="vase" aria-pressed="false">Ваза</button>
      <button class="chip" type="button" data-dish="teapot" aria-pressed="false">Чайник</button>
    </div>
    <form id="form" autocomplete="off">
      <input id="thought" maxlength="70" placeholder="Например: завтра дедлайн" aria-label="Мысль для посуды">
      <button class="throw" type="submit">Разбить</button>
    </form>
    <p class="hint">Смахни посуду вверх. Тапни по осколкам или по котикам, когда они заглянут.</p>
  </div>
</div>

  'Я рядом. Даже когда не рядом.',

  'Ты моё самое любимое место.',

function wrap(g, text, maxW) {
  const words = text.split(/\s+/).filter(Boolean), lines = [];
  let line = '';
  for (let w of words) {
    while (g.measureText(w).width > maxW && w.length > 1) {
      let cut = w.length - 1;
      while (cut > 1 && g.measureText(w.slice(0, cut) + '-').width > maxW) cut--;
      if (line) { lines.push(line); line = ''; }
      lines.push(w.slice(0, cut) + '-'); w = w.slice(cut);
    }
    const t = line ? line + ' ' + w : w;
    if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
const TAU = Math.PI * 2;
function disc(g, x, y, r, fill) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.fillStyle = fill; g.fill(); }
function ring(g, x, y, r, w, col) { g.beginPath(); g.arc(x, y, r, 0, TAU); g.lineWidth = w; g.strokeStyle = col; g.stroke(); }
function radial(g, r, c1, c2) { const gr = g.createRadialGradient(-r * .3, -r * .35, r * .1, 0, 0, r); gr.addColorStop(0, c1); gr.addColorStop(1, c2); return gr; }

const PAINT = {
  plate(g, r) {
    disc(g, 0, 0, r, radial(g, r, '#ffffff', '#dfe3e8'));
    ring(g, 0, 0, r * .9, r * .045, '#2f5d9e');
    for (let i = 0; i < 28; i++) { const a = i / 28 * TAU; disc(g, Math.cos(a) * r * .965, Math.sin(a) * r * .965, r * .016, '#2f5d9e'); }
    ring(g, 0, 0, r * .7, 2, 'rgba(0,0,0,.07)');
  },
  bowl(g, r) {
    disc(g, 0, 0, r, radial(g, r, '#fbf3e4', '#cdb994'));
    const sh = g.createRadialGradient(0, 0, r * .55, 0, 0, r);
    sh.addColorStop(0, 'rgba(0,0,0,0)'); sh.addColorStop(.8, 'rgba(80,50,20,.18)'); sh.addColorStop(1, 'rgba(80,50,20,.05)');
    disc(g, 0, 0, r, sh);
    ring(g, 0, 0, r * .9, r * .045, '#b8533a');
  },
  saucer(g, r) {
    disc(g, 0, 0, r, radial(g, r, '#fff7f7', '#ead2d6'));
    ring(g, 0, 0, r * .9, r * .045, '#cf7f97');
    ring(g, 0, 0, r * .8, 1.5, '#c9a24a');
    ring(g, 0, 0, r * .55, 2, 'rgba(0,0,0,.06)');
  },
  mug(g, r) {
    const br = r * .8;
    g.lineWidth = r * .11; g.strokeStyle = '#c98f22'; g.lineCap = 'round';
    g.beginPath(); g.arc(br * .97, 0, r * .15, -1.3, 1.3); g.stroke();
    disc(g, 0, 0, br, radial(g, br, '#f3c55a', '#c98f22'));
    const inn = g.createRadialGradient(0, 0, br * .4, 0, 0, br * .86);
    inn.addColorStop(0, '#fff7e4'); inn.addColorStop(.85, '#f1e2bf'); inn.addColorStop(1, '#d9c393');
    disc(g, 0, 0, br * .86, inn);
  },
  glass(g, r) {
    const gr = g.createRadialGradient(-r * .25, -r * .3, r * .05, 0, 0, r);
    gr.addColorStop(0, 'rgba(225,250,255,.32)'); gr.addColorStop(.75, 'rgba(170,225,235,.16)'); gr.addColorStop(1, 'rgba(200,240,250,.45)');
    disc(g, 0, 0, r, gr);
    ring(g, 0, 0, r * .965, r * .07, 'rgba(235,252,255,.75)');
    ring(g, 0, 0, r * .62, 2, 'rgba(235,252,255,.35)');
    g.lineCap = 'round'; g.strokeStyle = 'rgba(255,255,255,.7)';
    g.lineWidth = r * .06; g.beginPath(); g.arc(0, 0, r * .8, Math.PI * 1.1, Math.PI * 1.45); g.stroke();
    g.lineWidth = r * .03; g.beginPath(); g.arc(0, 0, r * .8, Math.PI * 1.55, Math.PI * 1.62); g.stroke();
  },
  wine(g, r) {
    const gr = g.createRadialGradient(-r * .25, -r * .3, r * .05, 0, 0, r);
    gr.addColorStop(0, 'rgba(255,235,242,.28)'); gr.addColorStop(.8, 'rgba(240,200,215,.14)'); gr.addColorStop(1, 'rgba(255,230,240,.4)');
    disc(g, 0, 0, r, gr);
    disc(g, r * .05, r * .08, r * .5, 'rgba(150,20,55,.3)');
    ring(g, 0, 0, r * .975, r * .035, 'rgba(255,245,250,.85)');
    disc(g, 0, 0, r * .12, 'rgba(255,255,255,.25)'); ring(g, 0, 0, r * .12, 1.5, 'rgba(255,255,255,.5)');
    g.lineCap = 'round'; g.strokeStyle = 'rgba(255,255,255,.75)';
    g.lineWidth = r * .045; g.beginPath(); g.arc(0, 0, r * .84, Math.PI * 1.15, Math.PI * 1.42); g.stroke();
  },
  vase(g, r) {
    disc(g, 0, 0, r, radial(g, r, '#4f7bc4', '#1b3466'));
    g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = r * .025;
    for (let i = 0; i < 18; i++) { const a = i / 18 * TAU; g.beginPath(); g.arc(Math.cos(a) * r * .86, Math.sin(a) * r * .86, r * .07, a + .6, a + Math.PI + .6 - 1.2); g.stroke(); }
    ring(g, 0, 0, r * .74, r * .02, 'rgba(255,255,255,.45)');
    disc(g, 0, -r * .42, r * .21, '#d9e3f5'); disc(g, 0, -r * .42, r * .16, '#0b162e');
  },
  teapot(g, r) {
    const br = r * .72, body = '#f4f1ea';
    g.fillStyle = '#e7e1d5';
    g.beginPath(); g.moveTo(br * .8, -r * .14); g.lineTo(r * .97, -r * .34); g.lineTo(r * .99, -r * .22); g.lineTo(br * .85, r * .14); g.closePath(); g.fill();
    g.lineWidth = r * .09; g.strokeStyle = '#e7e1d5'; g.lineCap = 'round';
    g.beginPath(); g.arc(-br * 1.03, 0, r * .16, Math.PI - 1.3, Math.PI + 1.3); g.stroke();
    disc(g, 0, 0, br, radial(g, br, body, '#d7d0c2'));
    ring(g, 0, 0, br * .88, 3, '#3a7d6b');
    for (let i = 0; i < 16; i++) { const a = i / 16 * TAU; disc(g, Math.cos(a) * br * .94, Math.sin(a) * br * .94, r * .018, '#3a7d6b'); }
    ring(g, 0, -br * .5, r * .16, 1.5, 'rgba(58,125,107,.6)');
    disc(g, 0, -br * .5, r * .05, '#3a7d6b');
  }
};

function renderDish() {
  const d = DISH[dishType], r = Math.round(R * d.k);
  const c = document.createElement('canvas');
  c.width = c.height = Math.ceil(2 * r * dpr);
  const g = c.getContext('2d');
  g.scale(dpr, dpr); g.translate(r, r);
  PAINT[dishType](g, r);

  const text = input.value.trim(), tr = d.tr || 1, oy = (d.ty || 0) * r;
  g.save(); g.translate(0, oy); g.rotate(-.06); g.textAlign = 'center'; g.textBaseline = 'middle';
  if (d.glass || dishType === 'vase') { g.shadowColor = 'rgba(0,20,40,.75)'; g.shadowBlur = 4; }
  if (text) {
    let size = r * (d.glass ? .38 : .34) * Math.min(1, tr + .15), lines;
    const box = r * 1.15 * tr;
    do { g.font = size + 'px Neucha, "Comic Sans MS", cursive'; lines = wrap(g, text, box); size *= .92; }
    while ((lines.length * size * 1.1 > box || lines.length > 5) && size > 8);
    const lh = size / .92 * 1.05;
    g.fillStyle = d.ink;
    lines.forEach((l, i) => g.fillText(l, 0, (i - (lines.length - 1) / 2) * lh));
  } else {
    const light = d.glass || dishType === 'vase';
    g.font = (r * (d.glass ? .22 : .17) * Math.min(1, tr + .2)) + 'px Neucha, "Comic Sans MS", cursive';
    g.fillStyle = light ? 'rgba(240,252,255,.65)' : 'rgba(60,70,90,.42)';
    g.fillText('напиши здесь,', 0, -r * .1 * tr); g.fillText('что гложет', 0, r * .1 * tr);
  }
  g.restore();
  dish.c = c; dish.r = r; dish.type = dishType;
}

/* ---------- shards ---------- */
function makeShards(r, type) {
  const [lo, hi] = DISH[type].shards;
  const n = reduce ? 6 : Math.floor(rand(lo, hi)), base = rand(0, TAU), polys = [];
  const A = [], ri = [], rm = [];
  for (let i = 0; i < n; i++) { A.push(base + (i + rand(-.3, .3)) / n * TAU); ri.push(r * rand(.25, .45)); rm.push(r * rand(.6, .8)); }
  const P = (rad, a) => [Math.cos(a) * rad, Math.sin(a) * rad];
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, a0 = A[i], a1 = j === 0 ? A[0] + TAU : A[j];
    polys.push([[0, 0], P(ri[i], a0), P(ri[j], a1)]);
    polys.push([P(ri[i], a0), P(rm[i], a0), P(rm[j], a1), P(ri[j], a1)]);
    const outer = [P(rm[i], a0)];
    for (let k = 0; k <= 4; k++) outer.push(P(r + 1, a0 + (a1 - a0) * k / 4));
    outer.push(P(rm[j], a1));
    polys.push(outer);
  }
  return polys.map(p => ({ p, cx: p.reduce((s, q) => s + q[0], 0) / p.length, cy: p.reduce((s, q) => s + q[1], 0) / p.length }));
}

function smash() {
  const { x, y, s, rot, c, r, type } = dish;
  const glass = !!DISH[type].glass, cos = Math.cos(rot), sin = Math.sin(rot);
  for (const sh of makeShards(r, type)) {
    const ox = (sh.cx * cos - sh.cy * sin) * s, oy = (sh.cx * sin + sh.cy * cos) * s;
    const len = Math.hypot(ox, oy) || 1, sp = rand(140, glass ? 640 : 520);
    shards.push({
      ...sh, c, r, s, glass, x: x + ox, y: y + oy, a: rot,
      vx: ox / len * sp + rand(-60, 60), vy: oy / len * sp * .6 - rand(60, 260), va: rand(-9, 9),
      floor: floorTop + rand(6, Math.min(70, (H - floorTop) * .45)), t: 0, landed: false
    });
  }
  const nd = reduce ? 8 : (glass ? 40 : 26);
  for (let i = 0; i < nd; i++) { const a = rand(0, TAU), sp = rand(60, 380); dust.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 80, t: 0, life: rand(.3, .8), sz: rand(1, 3), glass }); }
  const rays = [];
  for (let i = 0; i < 7; i++) rays.push([rand(0, TAU), rand(10, 34)]);
  marks.push({ x, y, t: 0, rays });
  if (marks.length > 12) marks.shift();
  if (shards.length > 420) shards.splice(0, shards.length - 420);
  if (!reduce) shake = type === 'vase' || type === 'teapot' ? .26 : .18;
  crash(type);

  count++; countEl.textContent = count;
  try { localStorage.setItem('bp-count', String(count)); } catch (e) {}
  const now = performance.now() / 1000;
  combo = now - lastSmash < 2.4 ? combo + 1 : 1; lastSmash = now;
  if (combo >= 2) showCombo(combo); else showToast(pick(Math.random() < .4 ? LOC[loc].phrases : PHRASES));
  sinceCat++; idleT = 0;
  if (!cats.length && sinceCat >= 4 && Math.random() < .7) spawnCats();
  sessionSmashes++;
  if (sessionSmashes >= NOTE_FIRST && (sessionSmashes - NOTE_FIRST) % NOTE_EVERY === 0) setTimeout(showNote, 900);

  dish.c = null; state = 'gone';
  setTimeout(() => {
    input.value = ''; renderDish();
    const p = restPos(); dish.x = p.x; dish.y = H + dish.r; dish.s = 1; dish.rot = 0;
    state = 'idle';
  }, 650);
}

/* ---------- two white cats ---------- */

function updateCats(dt) {

const FUR = '#f5f3ef', SHADE = '#d8d3c9', PINK = '#efa3b2';

    });
    const bd = c.createLinearGradient(0, -48, 0, -12); bd.addColorStop(0, FUR); bd.addColorStop(1, SHADE);
    c.fillStyle = bd; c.beginPath(); c.ellipse(0, -30, 38, 17, 0, 0, TAU); c.fill();
    c.save(); c.translate(42, -44 + Math.sin(ph * 2) * 1.2); drawHead(c, cat, blink); c.restore();
  } else {
    c.strokeStyle = FUR; c.lineWidth = 8; c.beginPath(); c.moveTo(-14, -6);
    c.quadraticCurveTo(-42, 0, -32 + Math.sin(cat.tail * 2) * 4, -18 + Math.sin(cat.tail * 2.3) * 4); c.stroke();
    const bd = c.createLinearGradient(-20, -60, 10, 0); bd.addColorStop(0, FUR); bd.addColorStop(1, SHADE);
    c.fillStyle = bd; c.beginPath(); c.ellipse(-2, -30, 24, 30, -.1, 0, TAU); c.fill();
    c.fillStyle = FUR; c.beginPath(); c.ellipse(10, -4, 8, 5, 0, 0, TAU); c.ellipse(-12, -4, 8, 5, 0, 0, TAU); c.fill();
    c.save(); c.translate(8, -66); drawHead(c, cat, blink || cat.petted > 0); c.restore();
  }
  c.restore();
}
function drawHead(c, cat, closed) {
  c.fillStyle = FUR;
  c.beginPath(); c.moveTo(-13, -8); c.lineTo(-9, -27); c.lineTo(1, -12); c.fill();
  c.beginPath(); c.moveTo(4, -12); c.lineTo(12, -26); c.lineTo(15, -6); c.fill();
  c.fillStyle = PINK;
  c.beginPath(); c.moveTo(-10, -11); c.lineTo(-8.5, -21); c.lineTo(-3, -12); c.fill();
  c.beginPath(); c.moveTo(6, -12); c.lineTo(11.5, -21); c.lineTo(13, -9); c.fill();
  const hg = c.createRadialGradient(-4, -5, 2, 0, 0, 16); hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, SHADE);
  c.fillStyle = hg; c.beginPath(); c.arc(0, 0, 15.5, 0, TAU); c.fill();
  if (closed) {
    c.strokeStyle = '#5a5550'; c.lineWidth = 1.6;
    c.beginPath(); c.arc(-5, -1, 3, .2, Math.PI - .2); c.stroke();
    c.beginPath(); c.arc(6, -1, 3, .2, Math.PI - .2); c.stroke();
  } else {
    c.fillStyle = cat.eye; c.beginPath(); c.arc(-5, -2, 3.4, 0, TAU); c.arc(6, -2, 3.4, 0, TAU); c.fill();
    c.fillStyle = '#1d1f24'; c.fillRect(-5.7, -4.8, 1.4, 5.4); c.fillRect(5.3, -4.8, 1.4, 5.4);
    c.fillStyle = '#fff'; c.fillRect(-4.2, -4, 1, 1); c.fillRect(6.8, -4, 1, 1);
  }
  if (cat.petted > 0) { c.fillStyle = 'rgba(239,140,160,.45)'; c.beginPath(); c.ellipse(-9, 4, 3.5, 2, 0, 0, TAU); c.ellipse(10, 4, 3.5, 2, 0, 0, TAU); c.fill(); }
  c.fillStyle = PINK; c.beginPath(); c.moveTo(-1.5, 4); c.lineTo(2.5, 4); c.lineTo(.5, 6.5); c.fill();
  c.strokeStyle = 'rgba(110,110,110,.55)'; c.lineWidth = .8;
  [[5, 0], [6.5, 3]].forEach(([y, s]) => {
    c.beginPath(); c.moveTo(4, y); c.lineTo(24, y - 2 + s); c.stroke();
    c.beginPath(); c.moveTo(-3, y); c.lineTo(-22, y - 2 + s); c.stroke();
  });
}

/* ---------- throwing & input ---------- */
function throwDish(vx, vy) {
  if (state !== 'idle' && state !== 'drag') return;
  ensureAudio();
  let lo = wallTopPx + R * .5, hi = floorTop - R * .7;
  if (hi < lo) hi = lo + 10;
  const ty = rand(lo, hi);
  let tx = vy < -1 ? dish.x + vx / -vy * (dish.y - ty) : W / 2 + rand(-W * .25, W * .25);
  tx = clamp(tx, 50, W - 50);
  fly = { sx: dish.x, sy: dish.y, tx, ty, t: 0, dur: .42, spin: clamp(vx / 300, -4, 4) + rand(-2, 2) };
  state = 'fly'; whoosh();
}

function localPt(e) { const b = cv.getBoundingClientRect(); return [e.clientX - b.left, e.clientY - b.top]; }

cv.addEventListener('pointerdown', e => {
  ensureAudio();
  const [px, py] = localPt(e);
  if (state === 'idle' && Math.hypot(px - dish.x, py - dish.y) <= dish.r * 1.15) {
    state = 'drag'; cv.classList.add('dragging'); cv.setPointerCapture(e.pointerId);
    drag = { dx: dish.x - px, dy: dish.y - py, samples: [[px, py, performance.now()]] };
    return;
  }
  const kitty = catAt(px, py);
  if (kitty) { petCat(kitty); return; }
  let hit = 0;
  for (const s of shards) {
    if (Math.hypot(s.x - px, s.y - py) < 34 + s.r * s.s * .3) {
      s.landed = false; s.vy = -rand(280, 620); s.vx = (s.x - px) * 6 + rand(-120, 120); s.va = rand(-14, 14);
      s.t = Math.min(s.t, 3); hit++;
    }
  }
  if (hit) tink(Math.min(hit, 4));
});
cv.addEventListener('pointermove', e => {
  if (state !== 'drag') return;
  const [px, py] = localPt(e);
  dish.x = px + drag.dx; dish.y = py + drag.dy;
  drag.samples.push([px, py, performance.now()]);
  if (drag.samples.length > 8) drag.samples.shift();
});
function endDrag() {
  if (state !== 'drag') return;
  cv.classList.remove('dragging');
  const now = performance.now(), s = drag.samples.filter(q => now - q[2] < 120);
  let vx = 0, vy = 0;
  if (s.length > 1) { const a = s[0], z = s[s.length - 1], dt = Math.max(.016, (z[2] - a[2]) / 1000); vx = (z[0] - a[0]) / dt; vy = (z[1] - a[1]) / dt; }
  if (vy < -350) throwDish(vx, vy); else state = 'idle';
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', endDrag);

document.getElementById('form').addEventListener('submit', e => { e.preventDefault(); throwDish(rand(-200, 200), -900); });
input.addEventListener('input', () => { if (state === 'idle' || state === 'drag') renderDish(); });
document.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
  dishType = b.dataset.dish;
  document.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  if (state === 'idle') renderDish();
}));
document.querySelectorAll('.loc').forEach(b => b.addEventListener('click', () => { if (b.dataset.loc !== loc) setLoc(b.dataset.loc); }));
document.getElementById('sweep').addEventListener('click', () => {
  ensureAudio();
  if (!shards.length) { showToast('Уже чисто'); return; }
  const dir = Math.random() < .5 ? -1 : 1;
  for (const s of shards) { s.landed = false; s.vx = dir * rand(900, 1600); s.vy = -rand(40, 180); s.va = rand(-10, 10); s.t = Math.max(s.t, 7.3); }
  swish(); showToast('Чистота');
});

/* ---------- sound ---------- */
let ac = null, muted = false;
const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => { muted = !muted; muteBtn.textContent = muted ? 'Звук: выкл' : 'Звук: вкл'; });
function ensureAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === 'suspended') ac.resume().catch(() => {});
}
const ok = () => ac && !muted;
function noise(dur, pow) {
  const len = Math.max(1, Math.floor(ac.sampleRate * dur)), buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, pow);
  const src = ac.createBufferSource(); src.buffer = buf; return src;
}
function ping(freq, start, len, gain, wave) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = wave || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, start); g.gain.linearRampToValueAtTime(gain, start + .004); g.gain.exponentialRampToValueAtTime(.0001, start + len);
  o.connect(g).connect(ac.destination); o.start(start); o.stop(start + len + .05);
}
function whoosh() {
  if (!ok()) return;
  const src = noise(.35, 1), bp = ac.createBiquadFilter(), g = ac.createGain(), t = ac.currentTime;
  bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(2200, t + .35);
  g.gain.value = .12; src.connect(bp).connect(g).connect(ac.destination); src.start(t);
}
function swish() {
  if (!ok()) return;
  const t = ac.currentTime;
  for (let k = 0; k < 3; k++) {
    const src = noise(.25, 1.5), bp = ac.createBiquadFilter(), g = ac.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 2500; bp.Q.value = .8; g.gain.value = .25;
    src.connect(bp).connect(g).connect(ac.destination); src.start(t + k * .12);
  }
  for (let k = 0; k < 6; k++) ping(rand(2500, 6000), t + rand(.05, .4), .12, .03);
}
function tink(n) {
  if (!ok()) return;
  const t = ac.currentTime;
  for (let k = 0; k < n; k++) ping(rand(3000, 7000), t + k * .04, rand(.08, .18), .07);
}
function chime() {
  if (!ok()) return;
  const t = ac.currentTime;
  [784, 988, 1175, 1568].forEach((f, i) => ping(f, t + i * .09, .9, .08));
}
function meow(p) {
  if (!ok()) return;
  p = p || 1;
  const t = ac.currentTime, o = ac.createOscillator(), lp = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(520 * p, t); o.frequency.linearRampToValueAtTime(820 * p, t + .16); o.frequency.exponentialRampToValueAtTime(430 * p, t + .55);
  lp.type = 'lowpass'; lp.Q.value = 6;
  lp.frequency.setValueAtTime(900 * p, t); lp.frequency.linearRampToValueAtTime(2200 * p, t + .18); lp.frequency.linearRampToValueAtTime(800 * p, t + .55);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.12, t + .05); g.gain.exponentialRampToValueAtTime(.0001, t + .6);
  o.connect(lp).connect(g).connect(ac.destination); o.start(t); o.stop(t + .65);
  const pn = noise(1.3, .4), plp = ac.createBiquadFilter(), pg = ac.createGain(), lfo = ac.createOscillator(), lg = ac.createGain();
  plp.type = 'lowpass'; plp.frequency.value = 260; pg.gain.value = 0;
  lfo.frequency.value = 24; lg.gain.value = .22; lfo.connect(lg).connect(pg.gain);
  pn.connect(plp).connect(pg).connect(ac.destination); pn.start(t + .55); lfo.start(t + .55); lfo.stop(t + 1.9);
}
/* Each dish has its own voice */
const SOUND = {
  plate:  { dur: .7,  decay: 3,   filter: 'highpass', freq: 900,  gain: .65, pings: 7,  pLo: 2200, pHi: 6500,  pGain: .09, pLen: [.12, .45], spread: .22, wave: 'triangle', thud: [160, 45, .45, .22] },
  bowl:   { dur: .5,  decay: 2.2, filter: 'bandpass', freq: 650,  gain: .9,  pings: 4,  pLo: 900,  pHi: 2200,  pGain: .08, pLen: [.08, .22], spread: .14, wave: 'sine',     thud: [110, 32, .8, .3], rattle: true },
  saucer: { dur: .45, decay: 4,   filter: 'highpass', freq: 2600, gain: .4,  pings: 11, pLo: 4200, pHi: 9500,  pGain: .07, pLen: [.06, .3],  spread: .3,  wave: 'sine',     thud: [260, 120, .12, .08] },
  mug:    { dur: .45, decay: 2.5, filter: 'bandpass', freq: 950,  gain: .8,  pings: 5,  pLo: 1400, pHi: 3200,  pGain: .08, pLen: [.08, .25], spread: .15, wave: 'triangle', thud: [140, 40, .6, .24], rattle: true },
  glass:  { dur: .9,  decay: 2.5, filter: 'highpass', freq: 3800, gain: .55, pings: 16, pLo: 5000, pHi: 11500, pGain: .06, pLen: [.15, .7],  spread: .5,  wave: 'sine',     thud: [320, 160, .1, .06], sparkle: true },
  wine:   { dur: 1.1, decay: 2.2, filter: 'highpass', freq: 4500, gain: .45, pings: 12, pLo: 6000, pHi: 12500, pGain: .05, pLen: [.3, 1.1],  spread: .4,  wave: 'sine',     thud: [400, 200, .06, .05], sparkle: true, ring: true },
  vase:   { dur: 1,   decay: 2,   filter: 'bandpass', freq: 700,  gain: 1,   pings: 8,  pLo: 1200, pHi: 4000,  pGain: .08, pLen: [.1, .4],   spread: .35, wave: 'triangle', thud: [90, 28, .9, .4], rattle: true },
  teapot: { dur: .8,  decay: 2.4, filter: 'bandpass', freq: 850,  gain: .9,  pings: 6,  pLo: 1500, pHi: 4200,  pGain: .08, pLen: [.1, .35],  spread: .25, wave: 'triangle', thud: [120, 35, .7, .3], rattle: true, lid: true }
};
function crash(type) {
  if (!ok()) return;
  const S = SOUND[type] || SOUND.plate, t = ac.currentTime;
  if (S.ring) ping(rand(1700, 2400), t, 1.6, .06);
  const src = noise(S.dur, S.decay), f = ac.createBiquadFilter(), g = ac.createGain();
  f.type = S.filter; f.frequency.value = S.freq; if (S.filter === 'bandpass') f.Q.value = .7;
  g.gain.value = S.gain;
  src.connect(f).connect(g).connect(ac.destination); src.start(t);
  for (let k = 0; k < S.pings; k++) ping(rand(S.pLo, S.pHi), t + rand(0, S.spread), rand(S.pLen[0], S.pLen[1]), S.pGain, S.wave);
  const [f0, f1, tg0, tl] = S.thud, th = ac.createOscillator(), tg = ac.createGain();
  th.frequency.setValueAtTime(f0, t); th.frequency.exponentialRampToValueAtTime(f1, t + tl * .7);
  tg.gain.setValueAtTime(tg0, t); tg.gain.exponentialRampToValueAtTime(.0001, t + tl);
  th.connect(tg).connect(ac.destination); th.start(t); th.stop(t + tl + .05);
  if (S.rattle) for (let k = 0; k < 5; k++) {
    const st = t + .28 + k * rand(.05, .11), n = noise(.05, 2), bp = ac.createBiquadFilter(), ng = ac.createGain();
    bp.type = 'bandpass'; bp.frequency.value = rand(700, 1600); bp.Q.value = 3; ng.gain.value = .5 * (1 - k / 6);
    n.connect(bp).connect(ng).connect(ac.destination); n.start(st);
  }
  if (S.sparkle) for (let k = 0; k < 10; k++) ping(rand(6000, 12000), t + .35 + rand(0, .6), rand(.05, .15), .03);
  if (S.lid) { let st = t + .45; for (let k = 0; k < 7; k++) { ping(rand(1000, 1300), st, .09, .06, 'triangle'); st += .13 * (1 - k / 9); } }
}

/* ---------- loop ---------- */
let last = performance.now();
function update(dt) {
  if (state === 'idle') {
    const p = restPos(), k = Math.min(1, dt * 10);
    dish.x += (p.x - dish.x) * k; dish.y += (p.y - dish.y) * k;
    dish.rot += (0 - dish.rot) * k; dish.s += (1 - dish.s) * k;
  } else if (state === 'fly') {
    fly.t += dt;
    const p = Math.min(1, fly.t / fly.dur), e = 1 - (1 - p) * (1 - p);
    dish.x = fly.sx + (fly.tx - fly.sx) * e;
    dish.y = fly.sy + (fly.ty - fly.sy) * e - Math.sin(p * Math.PI) * 50;
    dish.s = 1 - .52 * e; dish.rot += fly.spin * dt;
    if (p >= 1) smash();
  }
  for (const s of shards) {
    s.t += dt;
    if (!s.landed) {
      s.vy += 1900 * dt; s.x += s.vx * dt; s.y += s.vy * dt; s.a += s.va * dt;
      if (s.y > s.floor && s.vy > 0) {
        s.y = s.floor; s.vy *= -.22; s.vx *= .55; s.va *= .4;
        if (Math.abs(s.vy) < 60) s.landed = true;
      }
    }
  }
  shards = shards.filter(s => s.t < 9 && s.x > -200 && s.x < W + 200);
  for (const d of dust) { d.t += dt; d.vy += 900 * dt; d.x += d.vx * dt; d.y += d.vy * dt; }
  dust = dust.filter(d => d.t < d.life);
  for (const h of hearts) { h.t += dt; h.x += (h.vx + Math.sin(h.t * 4 + h.wob) * 30) * dt; h.y += h.vy * dt; }
  hearts = hearts.filter(h => h.t < h.life);
  for (const m of marks) m.t += dt;
  marks = marks.filter(m => m.t < 6);
  shake = Math.max(0, shake - dt);
  updateCats(dt);
  idleT += dt;
  if (!cats.length && idleT > 30) { idleT = 0; spawnCats(); }
}

function heartPath(c, x, y, s) {
  c.beginPath(); c.moveTo(x, y + s * .35);
  c.bezierCurveTo(x - s, y - s * .3, x - s * .5, y - s * 1.05, x, y - s * .45);
  c.bezierCurveTo(x + s * .5, y - s * 1.05, x + s, y - s * .3, x, y + s * .35);
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-5, 5) * shake * 5, rand(-5, 5) * shake * 5);
  if (bg) ctx.drawImage(bg, 0, 0, W, H);
  const mc = LOC[loc].mark;
  for (const m of marks) {
    const al = Math.min(1, (6 - m.t) / 2) * .55;
    ctx.strokeStyle = `rgba(${mc},${al})`; ctx.lineWidth = 1.5;
    for (const [a, l] of m.rays) { ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + Math.cos(a) * l, m.y + Math.sin(a) * l); ctx.stroke(); }
    ctx.fillStyle = `rgba(${mc},${al * .6})`; ctx.beginPath(); ctx.arc(m.x, m.y, 4, 0, TAU); ctx.fill();
  }
  [...cats].sort((a, b) => a.y - b.y).forEach(drawCat);
  for (const s of shards) {
    const al = s.t > 7 ? Math.max(0, 1 - (s.t - 7) / 2) : 1;
    ctx.save(); ctx.globalAlpha = al;
    ctx.translate(s.x, s.y); ctx.rotate(s.a); ctx.scale(s.s, s.s); ctx.translate(-s.cx, -s.cy);
    ctx.beginPath(); ctx.moveTo(s.p[0][0], s.p[0][1]);
    for (let i = 1; i < s.p.length; i++) ctx.lineTo(s.p[i][0], s.p[i][1]);
    ctx.closePath();
    ctx.save(); ctx.clip(); ctx.drawImage(s.c, -s.r, -s.r, 2 * s.r, 2 * s.r); ctx.restore();
    ctx.strokeStyle = s.glass ? 'rgba(235,252,255,.85)' : 'rgba(255,255,255,.5)'; ctx.lineWidth = (s.glass ? 1.4 : 1) / s.s; ctx.stroke();
    ctx.restore();
  }
  for (const d of dust) {
    ctx.globalAlpha = 1 - d.t / d.life;
    ctx.fillStyle = d.glass ? '#dff8ff' : 'rgba(255,255,255,.85)';
    ctx.fillRect(d.x, d.y, d.sz, d.sz);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  if (dish.c && state !== 'gone') {
    ctx.save();
    ctx.translate(dish.x, dish.y); ctx.rotate(dish.rot); ctx.scale(dish.s, dish.s);
    ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 26 * dpr; ctx.shadowOffsetY = 14 * dish.s * dpr;
    ctx.drawImage(dish.c, -dish.r, -dish.r, dish.r * 2, dish.r * 2);
    ctx.restore();
  }
  for (const h of hearts) {
    ctx.globalAlpha = Math.max(0, 1 - h.t / h.life);
    ctx.fillStyle = '#ff7b8f'; heartPath(ctx, h.x, h.y, h.sz); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function frame(now) {
  const dt = Math.min(.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}

app.dataset.loc = loc;
document.querySelectorAll('.loc').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.loc === loc)));
window.addEventListener('resize', resize);
resize();
const p0 = restPos(); dish.x = p0.x; dish.y = p0.y;
if (document.fonts && document.fonts.load) document.fonts.load('30px Neucha').then(() => renderDish()).catch(() => {});
setTimeout(() => { if (!cats.length) spawnCats(); }, 2500);
requestAnimationFrame(frame);
})();
</script>
